<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallel Futures - Home</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- Floating Toggle Button at the Top -->
    <div style="text-align: right; width: 90%; max-width: 600px; margin: 1rem auto 0 auto;">
        <button id="dark-toggle-btn" class="btn" style="background-color: #475569; padding: 0.5rem 1rem; font-size: 0.85rem;">🌗 Toggle Dark Mode</button>
    </div>

    <!-- Screen 1: Landing Page -->
    <section id="landing-screen" class="container text-center" style="margin-top: 0.5rem;">
        <h1>Every decision creates a different future.</h1>
        <p>Explore the careers you could build and the lives they create.</p>
        <button id="start-btn" class="btn">Start Simulation</button>
    </section>

    <!-- Screen 2: User Profile Form (Hidden by Default) -->
    <section id="profile-screen" class="container hidden" style="margin-top: 0.5rem;">
        <h2>Set Up Your Profile</h2>
        <form id="profile-form">
            <label>Name:</label>
            <input type="text" id="user-name" required placeholder="Enter your name">

            <label>Current College Year:</label>
            <select id="user-year">
                <option value="1st Year">1st Year</option>
                <option value="2nd Year">2nd Year</option>
                <option value="3rd Year">3rd Year</option>
                <option value="4th Year">4th Year</option>
            </select>

            <label>Interests:</label>
            <input type="text" id="user-interests" placeholder="e.g., Coding, Math, Security">

            <button type="submit" class="btn">Continue to Careers</button>
        </form>
    </section>

    <script>
        // 1. Theme Manager Logic
        const darkToggle = document.getElementById('dark-toggle-btn');
        
        // Immediately apply dark mode if previously saved
        if (localStorage.getItem('theme') === 'dark') {
            document.body.classList.add('dark-mode');
        }

        darkToggle.onclick = function() {
            document.body.classList.toggle('dark-mode');
            if (document.body.classList.contains('dark-mode')) {
                localStorage.setItem('theme', 'dark');
            } else {
                localStorage.setItem('theme', 'light');
            }
        };

        // 2. Navigation Toggle Logic
        const startBtn = document.getElementById('start-btn');
        const landingScreen = document.getElementById('landing-screen');
        const profileScreen = document.getElementById('profile-screen');
        const profileForm = document.getElementById('profile-form');

        startBtn.addEventListener('click', () => {
            landingScreen.classList.add('hidden');
            profileScreen.classList.remove('hidden');
        });

        profileForm.addEventListener('submit', (e) => {
            e.preventDefault();
            const profile = {
                name: document.getElementById('user-name').value,
                year: document.getElementById('user-year').value,
                interests: document.getElementById('user-interests').value
            };
            localStorage.setItem('userProfile', JSON.stringify(profile));
            window.location.href = 'careers.html';
        });
    </script>
</body>
</html>
